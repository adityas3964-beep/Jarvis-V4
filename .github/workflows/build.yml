name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          for z in $(ls jarvis-v*.zip 2>/dev/null | sort -V); do 
            unzip -qo "$z"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Download Vosk model
        run: |
          mkdir -p app/src/main/assets
          curl -fL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
          mv vosk-model-small-en-us-0.15 app/src/main/assets/model
          rm -f model.zip

      - name: Build APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            BUILD_CMD="./gradlew assembleDebug --no-daemon"
          else
            BUILD_CMD="gradle assembleDebug --no-daemon"
          fi

          set +e
          $BUILD_CMD > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            cat build.log
            msg=$(grep -iE "^e: |error:|What went wrong|Execution failed|Could not" -A2 build.log | head -25 | awk '{printf "%s%%0A", $0}')
            echo "::error::$msg"
          fi
          exit $code

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: jarvis-apk
          path: app/build/outputs/apk/debug/app-debug.apk
